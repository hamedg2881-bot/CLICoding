# Copy to workers.yaml and replace the endpoint/model aliases with verified values.
# This registers three physical model runtimes. It never starts/stops or changes them.
#
# All three models are intended to remain loaded simultaneously on DGX Spark.
# Configure each runtime's own memory/KV budget in its serving configuration.
# Keep one request per runtime initially; increase only after load testing.
# The model field must be the exact OpenAI-compatible served alias.

workers:
  # GPT-OSS-20B MXFP4 — fast reasoning, planning, chat and synthesis.
  - id: fast-reasoning
    base_url: http://127.0.0.1:8002/v1
    model: gpt-oss-20b
    capabilities: [chat, planning]
    enabled: false
    priority: 10
    max_concurrency: 1
    timeout_seconds: 120
    # api_key_env: CLICODING_FAST_API_KEY

  # Qwen3-Coder-Next NVFP4 — coding and code review.
  - id: coding-primary
    base_url: http://127.0.0.1:8000/v1
    model: qwen3-coder-next
    capabilities: [coding, review]
    enabled: false
    priority: 10
    max_concurrency: 1
    timeout_seconds: 240
    # api_key_env: CLICODING_CODER_API_KEY

  # Qwen3.6-35B-A3B NVFP4 — general multimodal, image understanding and vision.
  - id: multimodal-primary
    base_url: http://127.0.0.1:8001/v1
    model: qwen3.6-35b-a3b
    capabilities: [chat, vision]
    enabled: false
    priority: 10
    max_concurrency: 1
    timeout_seconds: 180
    # api_key_env: CLICODING_VISION_API_KEY
