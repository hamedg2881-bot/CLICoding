# Copy to workers.yaml only after verifying the served model aliases and runtime ports.
# This example never starts, stops, or reconfigures runtimes.
# Ports match the currently recorded DGX Spark worker topology.
# Keep concurrency at one until sustained load and unified-memory headroom are measured.
# Do not add tool_calling until the exact model/runtime/parser passes live tests.

workers:
  # GPT-OSS-20B — primary chat, reasoning and planning worker.
  - id: fast-reasoning
    base_url: http://127.0.0.1:8003/v1
    model: gpt-oss-20b
    capabilities: [chat, planning]
    enabled: false
    priority: 10
    max_concurrency: 1
    context_window_tokens: 8192
    max_output_tokens: 1024
    timeout_seconds: 180

  # Qwen3-Coder-Next — coding and code-review specialist.
  - id: coding-primary
    base_url: http://127.0.0.1:8004/v1
    model: qwen3-coder-next
    capabilities: [coding, review]
    enabled: false
    priority: 10
    max_concurrency: 1
    context_window_tokens: 8192
    max_output_tokens: 1024
    timeout_seconds: 240

  # Qwen3-VL-2B — experimental vision worker; enable only after live image tests.
  - id: multimodal-primary
    base_url: http://127.0.0.1:8005/v1
    model: qwen3-vl-2b
    capabilities: [vision]
    enabled: false
    priority: 10
    max_concurrency: 1
    context_window_tokens: 4096
    max_output_tokens: 512
    timeout_seconds: 180
