name: Orchestrator tests

on:
  push:
    branches: [main, feature/cds-ai-release-integration]
  pull_request:
    branches: [main, feature/cds-ai-regenerate-turns]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Validate packaged chat UI
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("src/clicoding_orchestrator/web/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/cds-ai-chat-ui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/cds-ai-chat-ui.js
          python -m pip wheel --no-deps . -w /tmp/cds-ai-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("/tmp/cds-ai-wheel").glob("*.whl"))
          with ZipFile(wheel) as archive:
              assert "clicoding_orchestrator/web/index.html" in archive.namelist()
          PY
      - name: Validate deployment examples
        run: |
          bash -n scripts/dgx_spark_model_preflight.sh
          python -c "import yaml; yaml.safe_load(open('config/workers.example.yaml', encoding='utf-8'))"
      - name: Run test suite
        run: pytest
