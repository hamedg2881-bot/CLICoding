name: Orchestrator tests

on:
  push:
    branches: [main, feature/cds-ai-identity-isolation]
  pull_request:
    branches: [main, architecture/conversation-first-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate deployment examples
        run: |
          bash -n scripts/dgx_spark_model_preflight.sh
          python -c "import yaml; yaml.safe_load(open('config/workers.example.yaml', encoding='utf-8'))"
      - name: Run test suite
        run: pytest
