name: Orchestrator tests

on:
  push:
    branches: [main, feature/cds-ai-release-integration]
  pull_request:
    branches: [main, feature/cds-ai-regenerate-turns]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate deployment examples
        run: |
          bash -n scripts/dgx_spark_model_preflight.sh
          python -c "import yaml; yaml.safe_load(open('config/workers.example.yaml', encoding='utf-8'))"
          python -m py_compile scripts/run_response_quality.py
          systemd-analyze verify deploy/cds-ai-orchestrator.service sandbox/clicoding-sandbox-broker.service
      - name: Run test suite
        run: pytest
      - name: Build immutable source transfer archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="CDS_AI_${GITHUB_SHA:0:12}.zip"
          git archive --format=zip --prefix=CDS_AI/ "${GITHUB_SHA}" > "dist/${archive}"
          (
            cd dist
            sha256sum "${archive}" > "${archive}.sha256"
          )
          printf 'revision=%s\narchive=%s\n' "${GITHUB_SHA}" "${archive}" > dist/RELEASE_INFO.txt
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path("dist").glob("CDS_AI_*.zip"))
          with ZipFile(archive) as bundle:
              names = bundle.namelist()
              assert names and all(name.startswith("CDS_AI/") for name in names)
              assert not any("/.env" in name and not name.endswith("/.env.example") for name in names)
              assert not any(name.endswith((".pem", ".key", ".p12", ".pfx")) for name in names)
              assert not any("/.git/" in name or "/__pycache__/" in name for name in names)
          print(f"Validated {len(names)} archive entries in {archive}")
          PY
      - name: Publish source transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDS_AI-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  wheelhouse-arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
      - name: Build offline CPython 3.12 ARM64 wheelhouse
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p dist/wheelhouse
          python -m pip wheel --only-binary=:all: --wheel-dir dist/wheelhouse ".[test]"
          python - <<'PY'
          import hashlib, json, platform, sys
          from pathlib import Path
          wheels = sorted(Path("dist/wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("wheelhouse is empty")
          manifest = {
              "format_version": 1,
              "python": sys.version,
              "implementation": sys.implementation.name,
              "machine": platform.machine(),
              "platform": platform.platform(),
              "wheels": [
                  {
                      "file": p.name,
                      "size": p.stat().st_size,
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
                  for p in wheels
              ],
          }
          if manifest["machine"] not in {"aarch64", "arm64"}:
              raise SystemExit(f"unexpected wheelhouse architecture: {manifest['machine']}")
          Path("dist/wheelhouse-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\\n", encoding="utf-8"
          )
          print(f"Built {len(wheels)} wheels for {manifest['machine']} / {sys.version.split()[0]}")
          PY
          tar -C dist -czf "dist/CDS_AI-wheelhouse-cp312-arm64-${GITHUB_SHA:0:12}.tar.gz" wheelhouse wheelhouse-manifest.json
          cd dist
          sha256sum CDS_AI-wheelhouse-cp312-arm64-${GITHUB_SHA:0:12}.tar.gz > CDS_AI-wheelhouse-cp312-arm64-${GITHUB_SHA:0:12}.tar.gz.sha256
      - name: Publish ARM64 offline wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: CDS_AI-wheelhouse-cp312-arm64-${{ github.sha }}
          path: |
            dist/CDS_AI-wheelhouse-cp312-arm64-*.tar.gz
            dist/CDS_AI-wheelhouse-cp312-arm64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
