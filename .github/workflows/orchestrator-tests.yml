name: Orchestrator tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate deployment examples
        run: |
          bash -n scripts/dgx_spark_model_preflight.sh
          python -c "import yaml; yaml.safe_load(open('config/workers.example.yaml', encoding='utf-8'))"
      - name: Run test suite
        run: pytest
